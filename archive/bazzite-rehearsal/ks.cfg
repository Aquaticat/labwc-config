# Automated Bazzite (KDE variant) install for labwc/uwsm migration testing
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=bazzite-labwc-test

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=btrfs

# Deploy the same image the host runs, straight from the registry
ostreecontainer --url=ghcr.io/ublue-os/bazzite:stable --transport=registry --no-signature-verification

services --enabled=sshd
rootpw --lock
user --name=user --groups=wheel --password=bazzite --plaintext
sshkey --username=user "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKC+Er6rUHS7wzrZpHoCwXdIyklbTSN6CnPOAFZk75zd labwc-vm-test"

# Keep a serial console on the installed system for headless debugging
bootloader --append="console=tty0 console=ttyS0,115200"

%post
echo 'user ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/99-vm-test
chmod 0440 /etc/sudoers.d/99-vm-test
%end

reboot
