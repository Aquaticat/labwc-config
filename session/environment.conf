# Installed as /usr/lib/environment.d/50-labwc-config.conf and read by the systemd user manager.
# Session defaults ship under /usr/share/labwc-config, ahead of the standard directories;
# a file under ~/.config still overrides them.
# Setting these for the user manager, not only in uwsm's environment,
# lets the XDG autostart generator see the session's autostart overrides.
XDG_CONFIG_DIRS=/usr/share/labwc-config/xdg:${XDG_CONFIG_DIRS:-/etc/xdg}
# sfwbar reads its system defaults from XDG_DATA_DIRS, not XDG_CONFIG_DIRS.
XDG_DATA_DIRS=/usr/share/labwc-config/data:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
