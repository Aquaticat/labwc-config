# launch-feedback shows a busy cursor while the app starts, then runs
# the command via `uwsm app --` itself.
launch-prefix=/home/user/.local/bin/launch-feedback
terminal=/home/user/AppImages/odytty.appimage
icon-theme=breeze-dark
font=Inter Variable:size=12
# Anchor above the sfwbar launcher icon (bottom-left), Kickoff-style.
anchor=bottom-left
x-margin=0
y-margin=0
# on-demand (not exclusive) keyboard focus: clicking outside moves focus away,
# and exit-on-keyboard-focus-loss (default yes) then closes the launcher.
keyboard-focus=on-demand
[colors]
background=000000f0
text=eff0f1ff
selection=6060c0ff
selection-text=ffffffff
border=346c92ff
[border]
radius=0
