[package]
name = "labwc-launcherd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Resident Slint launcher on a wlr-layer-shell surface, with an in-process Meta tap."

[dependencies]
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
launcher-core = { path = "../core" }
libc = "0.2"
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"

[build-dependencies]
slint-build = "=1.17.1"

[lints]
workspace = true
